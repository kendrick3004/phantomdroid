name: Build PhantomDroid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Cache .buildozer local
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-dev python3-pip libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libstdc++6
          pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: buildozer -v android debug

      - name: Save APK
        run: |
          mkdir -p builds
          APK=$(find bin -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" builds/PhantomDroid_latest.apk
            echo "APK: $APK"
          else
            echo "ERRO: APK nao encontrado"; find . -name "*.apk"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomDroid-APK
          path: builds/PhantomDroid_latest.apk
          retention-days: 30
