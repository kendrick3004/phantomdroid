name: Build PhantomDroid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Action oficial do Kivy — já tem Android SDK, NDK, ANT, tudo pronto
      - name: Build APK com Kivy Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomDroid-APK
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
