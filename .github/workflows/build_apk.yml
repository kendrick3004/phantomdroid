name: Build PhantomDroid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ant \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            openjdk-17-jdk \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Pre-stage Apache ANT for Buildozer
        run: |
          # Buildozer espera ANT em ~/.buildozer/android/platform/apache-ant-1.9.4/
          ANT_DIR="$HOME/.buildozer/android/platform"
          mkdir -p "$ANT_DIR"
          if [ ! -d "$ANT_DIR/apache-ant-1.9.4" ]; then
            echo "Baixando Apache ANT 1.9.4..."
            wget -q --retry-connrefused --tries=5 --waitretry=3 \
              -O /tmp/ant.tar.gz \
              "https://dlcdn.apache.org/ant/binaries/apache-ant-1.9.4-bin.tar.gz" \
              || wget -q --tries=3 \
              -O /tmp/ant.tar.gz \
              "https://downloads.apache.org/ant/binaries/apache-ant-1.9.4-bin.tar.gz"
            tar xzf /tmp/ant.tar.gz -C "$ANT_DIR"
            echo "ANT instalado em: $ANT_DIR/apache-ant-1.9.4"
            ls "$ANT_DIR/apache-ant-1.9.4/bin/"
          else
            echo "ANT já em cache."
          fi

      - name: Install Buildozer + Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomDroid-APK
          path: bin/*.apk
          retention-days: 30
